<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350"><rect width="840" height="350" rx="8" fill="#251f17"/><rect x="5" y="5" width="830" height="340" rx="5" fill="none" stroke="#a97a4b" stroke-width="2"/><g fill="#e5d2ad" font-family="Arial,sans-serif"><text x="28" y="39" font-size="22">Choose a target, then act</text><rect x="35" y="72" width="200" height="66" rx="4" fill="#493526" stroke="#bd9061"/><text x="135.0" y="113" text-anchor="middle" font-size="23">Tap Tab</text><text x="135.0" y="123" text-anchor="middle" font-size="13" fill="#d6b18a"></text><text x="260" y="112" font-size="20">→ Cycle smart combat targets</text><rect x="35" y="158" width="200" height="66" rx="4" fill="#493526" stroke="#bd9061"/><text x="135.0" y="199" text-anchor="middle" font-size="23">Hold Tab</text><text x="135.0" y="209" text-anchor="middle" font-size="13" fill="#d6b18a"></text><text x="260" y="198" font-size="20">→ Acquire the immediate target</text><text x="35" y="266" font-size="15">Shift+Tab reverses cycling. Then choose your action:</text><text x="35" y="296" font-size="15" fill="#d6b18a">R · Interact</text><text x="220" y="296" font-size="15" fill="#d6b18a">E · Examine</text><text x="415" y="296" font-size="15" fill="#d6b18a">Combat bar · Start attack</text><text x="28" y="330" fill="#bdab90" font-size="12">Control illustration · default bindings · change them in Settings → Input</text></g></svg>