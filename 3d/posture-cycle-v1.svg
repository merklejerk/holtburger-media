<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"><rect width="880" height="240" rx="8" fill="#251f17"/><rect x="5" y="5" width="870" height="230" rx="5" fill="none" stroke="#a97a4b" stroke-width="2"/><g fill="#e5d2ad" font-family="Arial,sans-serif"><text x="28" y="39" font-size="22">N: each press advances one resting posture</text><rect x="30" y="80" width="175" height="68" rx="4" fill="#493526" stroke="#bd9061"/><text x="117.5" y="121" text-anchor="middle" font-size="19">Standing</text><text x="220" y="121" font-size="23">→</text><rect x="245" y="80" width="175" height="68" rx="4" fill="#493526" stroke="#bd9061"/><text x="332.5" y="109" text-anchor="middle" font-size="19">Resting kneel</text><text x="332.5" y="134" text-anchor="middle" font-size="15">/ crouch</text><text x="435" y="121" font-size="23">→</text><rect x="460" y="80" width="175" height="68" rx="4" fill="#493526" stroke="#bd9061"/><text x="547.5" y="121" text-anchor="middle" font-size="19">Sitting</text><text x="650" y="121" font-size="23">→</text><rect x="675" y="80" width="175" height="68" rx="4" fill="#493526" stroke="#bd9061"/><text x="762.5" y="121" text-anchor="middle" font-size="19">Lying down</text><path d="M762 157 V183 H117 V157" fill="none" stroke="#d6b18a" stroke-width="2"/><path d="M112 165 L117 157 L122 165" fill="none" stroke="#d6b18a" stroke-width="2"/><text x="440" y="173" text-anchor="middle" font-size="14">N again returns to standing</text><text x="28" y="220" fill="#bdab90" font-size="12">Control illustration · default bindings · change them in Settings → Input</text></g></svg>